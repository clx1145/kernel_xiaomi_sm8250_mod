name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备代号'
        required: true
        default: 'alioth'
        type: choice
        options:
          - psyche
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      variant:
        description: '内核版本（nova / ultra / none）'
        required: true
        default: nova
        type: choice
        options:
          - nova
          - ultra
          - none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    # 生成短哈希（修复 substr() 报错）
    - name: Set short commit SHA
      id: vars
      run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-${{ inputs.device }}-${{ inputs.variant }}-${{ env.SHORT_SHA }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ inputs.device }}-${{ inputs.variant }}-
          ${{ runner.os }}-ccache-${{ inputs.device }}-
          ${{ runner.os }}-ccache-

    - name: Setup zyc-clang toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        archive=Clang-15.0.7-20251111.tar.gz
        wget "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/$archive"
        printf '%s  %s\n' 0ee566f2e78867b5de06e40b99bec1c561f3c12151f88ab23743b54a287c8cae "$archive" | sha256sum -c -
        tar -xzf "$archive"
        cd $GITHUB_WORKSPACE

    - name: Build kernel
      env:
        DEVICE: ${{ inputs.device }}
        VARIANT: ${{ inputs.variant }}
      run: bash build.sh "$DEVICE" "$VARIANT"

    - name: Show ccache stats
      run: ccache -s

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.device }}-${{ inputs.variant }}-kernel
        if-no-files-found: error
        path: |
          *.zip
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dtb
